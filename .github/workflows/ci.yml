name: CI
on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_APP_URL: https://example.com
      - run: npm run build
        env:
          VITE_APP_URL: https://example.com
          VITE_ENABLE_EXPERIMENTAL_SWAPS: "true"
